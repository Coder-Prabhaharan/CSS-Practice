<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-index</title>
    <style>
        .div1{
            position:relative;
            border: 1px solid black;
            width: 600px;
            height: 600px;
            background-color: red;
        }
        .div2{
            position:absolute;
            padding: 100px;
            top: 150px;
            left: 150px;
            border:1px solid black;
            background-color: yellow;
        }
    </style>
</head>
<body>
     <div>
        <div class="div1">
            <div class="div2">Welcome</div>
        </div>
     </div>
</body>
</html>
