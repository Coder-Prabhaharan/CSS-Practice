<html>
    <head>
      <title>Position3</title>
    </head>
    <style>
        div{
            width: 300px;
            height: 200px;
            border: 1px solid black;
        }

        .div1{
            background-color: red;
            position:relative;
            z-index: 1;
        }
        .div2{
            background-color:yellow;
            position: absolute;
            top:20px;
            left:20px;
            z-index: 0;
        }

    </style>
    <body>
          <div>

               <div class="div1"></div>
               <div class="div2"></div>
          </div>
    </body>
</html>
