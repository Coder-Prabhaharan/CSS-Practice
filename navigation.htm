<html>
    <head>
        <title>Navigation</title>
    </head>
    <style>

      *{
        margin:0;
        padding:0;
        box-sizing: border-box;
      }

          li{
            display: inline;
            margin:0 10px;
            background-color: black;
            padding: 5px;
            border-radius: 5px;
            transform:background-color 1s;
            cursor:pointer;
          }

          li:hover{
            background-color:rgb(112, 107, 107);
          }

          h1{
            display: inline;
          }

          .inner-container{
            display: flex;
            justify-content: space-between;
            background-color:brown;
            align-items: center;
            padding: 15px 15px;
          }

          a{
            text-decoration: none;
            color:white;
    
          }

          main{
            background-image: url("images/bg5.jpg");
            background-position: center;
            background-attachment: fixed;
            background-repeat:no-repeat;
            background-size: cover;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color:rgba();
          }

          main button{
            color:black;
            padding:6px;
            background-color:green;
            border-radius: 3px;
          }

          main button:hover{
            background-color: rgb(86, 209, 86);
          }
           
          p,h1{
             
              margin:10px 0px;
          }

           form{
            display: flex;
            flex-direction: column;
            background-color: gray;
            padding: 30px;
            margin-top:20px;
            border-radius: 10px;
           }

           form input{
            margin-bottom: 10px;
            padding:8px;
            border-radius:6px;

           }

           form label{
            margin-bottom:5px;
           }

           .register{
               padding:10px;
           }

           footer{
             text-align: center;
           }

           .footer{
            display: flex;
            justify-content:space-around;
            background-color: brown;
            align-items: center;
            padding:5px;
            
           }

           footer h5{
            background-color: rgb(77, 77, 146);
            padding:10px;
           }


    </style>
    <body> 

        <div class="inner-container">
            
            <h1>Amazon</h1>
              <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Gallery</a></li>
                    <li><a href="#">Projects</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
        </div>
          <main>
                    <h2>Welcome to Amazon!</h2>
                    <p>You can buy anything from this website.</p>
                    <button type="submit">Go to Buy</button>


            <form>
                   <h1>User Registration</h1>
                   <br>
            
                    <label for="name">Name</label>
                    <input type="text" id="name" placeholder="Enter name">

                    <label for="email">Mail</label>
                    <input type="email" id="email" placeholder="Mail">

                    <label for="mobile">Mobile</label>
                    <input type="number" id="mobile" placeholder="Mobile">

                    <button type="submit" id="register">Submit</button>
            </form>
          </main>
          <footer>

                    <div class="footer">
                      <p>this website  use for sell products!</p>
                       <div class="footer1">
                              <h4>Home</h4>
                              <h4>About</h4>
                              <h4>Gallery</h4>
                              <h4>Experience</h4>
                              <h4>Contact</h4>
                       </div>
                    </div>
                    <h5> &copy; Copy rights 2026</h5>
          </footer>

        

    </body>
</html>
