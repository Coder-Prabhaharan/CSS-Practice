<html>
    <head>
        <title>Navigation</title>
    </head>
    <style>

          li{
            display: inline;
            margin:0 15px;
            background-color: black;
            padding: 8px;
            border-radius: 5px;
            transform:background-color 1s;
            cursor:pointer;
          }

          li:hover{
            background-color:rgb(112, 107, 107);
          }

          h1{
            display: inline;
          }

          .container{
            display: flex;
            justify-content: space-between;
            background-color:brown;
            align-items: center;
          }

          a{
            text-decoration: none;
            color:white;
    
          }


    </style>
    <body> 

        <div class="container">
            
            <h1>Amazon</h1>
              <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Gallery</a></li>
                    <li><a href="#">Projects</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
        

        </div>

    </body>
</html>
